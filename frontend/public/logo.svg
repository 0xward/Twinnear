<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Twinnear — ledger mark">
  <title>Twinnear</title>
  <!-- paper tile -->
  <rect x="1" y="1" width="62" height="62" fill="#fdfbf6"/>
  <!-- double hairline ledger frame -->
  <rect x="4.5" y="4.5" width="55" height="55" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <rect x="8.5" y="8.5" width="47" height="47" fill="none" stroke="#c9c0ab" stroke-width="1"/>
  <!-- serif T, the ledger's initial -->
  <text x="32" y="38" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1f4d3a">T</text>
  <!-- ledger rules -->
  <line x1="16" y1="45" x2="48" y2="45" stroke="#1c1a17" stroke-width="1"/>
  <line x1="16" y1="49.5" x2="38" y2="49.5" stroke="#c9c0ab" stroke-width="1"/>
</svg>
